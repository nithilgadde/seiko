{% extends "base.html" %}

{% block title %}School Details - Seiko{% endblock %}

{% block content %}
<div id="schoolContent">Loading...</div>

<style>
.chances-card{background:linear-gradient(135deg,var(--bg-secondary),var(--bg-primary))}
.chances-meter{position:relative;height:24px;background:linear-gradient(to right,#ef4444,#f59e0b,#3b82f6,#10b981);border-radius:100px;margin:1.5rem 0}
.chances-bar{height:100%;border-radius:100px;opacity:.3}
.chances-marker{position:absolute;top:-8px;transform:translateX(-50%)}
.chances-score{background:var(--bg-secondary);padding:.25rem .75rem;border-radius:100px;font-weight:700;font-size:.875rem;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.chances-labels{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted)}
.chances-factors{margin-top:1.5rem;display:flex;flex-direction:column;gap:.5rem}
.factor-item{display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;background:var(--bg-primary);border-radius:var(--radius-sm);font-size:.875rem}
.factor-item svg{width:18px;height:18px;flex-shrink:0}
.factor-above svg{stroke:#10b981}.factor-match svg{stroke:#3b82f6}.factor-below svg{stroke:#ef4444}
.notification{position:fixed;bottom:2rem;right:2rem;background:var(--bg-secondary);border:1px solid var(--border);padding:1rem 1.5rem;border-radius:var(--radius);display:flex;align-items:center;gap:.75rem;box-shadow:0 10px 40px rgba(0,0,0,.3);transform:translateY(100px);opacity:0;transition:all .3s}
.notification.show{transform:translateY(0);opacity:1}
.notification svg{width:24px;height:24px;stroke:#10b981}
</style>
{% endblock %}

{% block scripts %}
<script>
const collegeId = parseInt(window.location.pathname.split('/').pop());

function renderSchool() {
    const college = SeikoData.getCollege(collegeId);
    const profile = SeikoData.getProfile();
    const container = document.getElementById('schoolContent');

    if (!college) {
        container.innerHTML = `<div class="card"><div class="empty-state"><h3>School not found</h3><p>This school may have been deleted.</p><a href="/schools" class="btn btn-primary">Back to Schools</a></div></div>`;
        return;
    }

    const status = STATUSES[college.status] || STATUSES.researching;
    const type = SCHOOL_TYPES[college.type] || SCHOOL_TYPES.reach;
    const deadlineInfo = DEADLINE_TYPES[college.deadline_type] || DEADLINE_TYPES.rd;
    const days = SeikoData.daysUntil(college.deadline_date);
    const tasks = college.tasks || [];
    const essays = college.essays || [];
    const doneTasks = tasks.filter(t => t.is_done).length;
    const progress = tasks.length > 0 ? Math.round((doneTasks / tasks.length) * 100) : 0;
    const chances = SeikoData.calculateChances(profile, college);

    let chancesHtml = '';
    if (chances) {
        chancesHtml = `<div class="card mb-4 chances-card"><div class="card-header"><span class="card-title">Your Chances</span><span class="badge" style="background:${chances.color}20;color:${chances.color};">${chances.label}</span></div><div class="card-body"><div class="chances-meter"><div class="chances-bar" style="width:${chances.score}%;background:${chances.color};"></div><div class="chances-marker" style="left:${chances.score}%;"><span class="chances-score">${chances.score}%</span></div></div><div class="chances-labels"><span>Far Reach</span><span>Reach</span><span>Match</span><span>Likely</span></div>${chances.factors.length ? `<div class="chances-factors">${chances.factors.map(f => `<div class="factor-item factor-${f.level}"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${f.level==='above'?'M5 13l4 4L19 7':f.level==='match'?'M20 12H4':'M19 9l-7 7-7-7'}"/></svg><span>${f.text}</span></div>`).join('')}</div>`:''}</div></div>`;
    } else if (!profile || (!profile.gpa && !profile.sat_score)) {
        chancesHtml = `<div class="card mb-4"><div class="card-body" style="text-align:center;padding:2rem;"><svg width="48" height="48" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24" style="margin:0 auto 1rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><h3 style="margin-bottom:.5rem;">See Your Chances</h3><p class="text-secondary mb-3">Add your GPA and test scores to see how you compare</p><a href="/profile" class="btn btn-primary">Add Your Stats</a></div></div>`;
    }

    container.innerHTML = `
        <div class="page-header"><div><div class="flex items-center gap-3 mb-2"><a href="/schools" class="btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a><h1 class="page-title">${college.name}</h1><span class="badge" style="background:${status.color}20;color:${status.color};">${status.name}</span></div>${college.location ? `<p class="page-subtitle">${college.location}</p>` : ''}</div><div class="flex gap-2"><button onclick="openEditModal()" class="btn btn-secondary"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Edit</button>${college.portal_url ? `<a href="${college.portal_url}" target="_blank" class="btn btn-primary"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>Open Portal</a>` : ''}</div></div>
        <div class="grid grid-4 mb-4"><div class="stat-card"><div class="text-sm text-secondary mb-1">Type</div><div class="font-semibold" style="color:${type.color};">${type.name}</div></div><div class="stat-card"><div class="text-sm text-secondary mb-1">Deadline</div><div class="font-semibold">${deadlineInfo.name}</div>${college.deadline_date ? `<div class="text-xs text-muted">${college.deadline_date}${days !== null ? ` (${days}d)` : ''}</div>` : ''}</div>${college.avg_gpa ? `<div class="stat-card"><div class="text-sm text-secondary mb-1">Avg GPA</div><div class="font-semibold">${college.avg_gpa}</div></div>` : ''}${college.acceptance_rate ? `<div class="stat-card"><div class="text-sm text-secondary mb-1">Acceptance Rate</div><div class="font-semibold">${college.acceptance_rate}%</div></div>` : ''}</div>
        <div class="card mb-4"><div class="card-body"><div class="flex items-center justify-between mb-2"><span class="font-semibold">Application Progress</span><span class="text-secondary">${progress}%</span></div><div class="progress"><div class="progress-bar" style="width:${progress}%;"></div></div></div></div>
        ${chancesHtml}
        <div class="grid grid-2">
            <div class="card"><div class="card-header"><span class="card-title">Tasks</span><button onclick="openTaskModal()" class="btn btn-primary btn-sm">Add Task</button></div><div class="card-body">${tasks.length ? tasks.map(t => `<div class="task-item" onclick="toggleTask(${t.id},this)"><div class="task-checkbox ${t.is_done?'checked':''}"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div><span class="task-name flex-1 ${t.is_done?'done':''}">${t.name}</span><button onclick="event.stopPropagation();deleteTask(${t.id})" class="btn btn-ghost btn-sm btn-icon" title="Delete"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div>`).join('') : '<p class="text-muted text-center py-4">No tasks yet</p>'}</div></div>
            <div class="card"><div class="card-header"><span class="card-title">Essays</span><button onclick="openEssayModal()" class="btn btn-primary btn-sm">Add Essay</button></div><div class="card-body">${essays.length ? essays.map(e => `<div style="padding:.75rem;background:var(--bg-primary);border-radius:var(--radius-sm);margin-bottom:.5rem;"><div class="flex items-center justify-between mb-1"><span class="font-medium">${e.title}</span><span class="badge" style="background:${e.status==='completed'?'#10b98120;color:#10b981':e.status==='drafting'?'#3b82f620;color:#3b82f6':'#64748b20;color:#64748b'};">${(e.status||'not_started').replace('_',' ')}</span></div>${e.word_limit?`<div class="text-xs text-muted">${e.word_limit} words</div>`:''}<div class="flex gap-2 mt-2"><select onchange="updateEssayStatus(${e.id},this.value)" class="form-select" style="padding:.375rem;font-size:.75rem;flex:1;">${['not_started','brainstorming','drafting','reviewing','completed'].map(s => `<option value="${s}" ${e.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select><button onclick="deleteEssay(${e.id})" class="btn btn-ghost btn-sm btn-icon"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div></div>`).join('') : '<p class="text-muted text-center py-4">No essays yet</p>'}</div></div>
        </div>
        ${college.notes ? `<div class="card mt-4"><div class="card-header"><span class="card-title">Notes</span></div><div class="card-body"><p>${college.notes}</p></div></div>` : ''}
        <div class="mt-4"><button onclick="deleteSchool()" class="btn btn-danger"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>Delete School</button></div>
        <!-- Edit Modal -->
        <div id="editModal" class="modal-overlay"><div class="modal"><div class="modal-header"><span class="modal-title">Edit School</span><button onclick="closeEditModal()" class="btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><form id="editForm"><div class="modal-body"><div class="form-group"><label class="form-label">School Name</label><input type="text" name="name" id="editName" class="form-input" required></div><div class="form-row"><div class="form-group"><label class="form-label">Location</label><input type="text" name="location" id="editLocation" class="form-input"></div><div class="form-group"><label class="form-label">Type</label><select name="type" id="editType" class="form-select"><option value="safety">Safety</option><option value="match">Match</option><option value="reach">Reach</option><option value="far_reach">Far Reach</option></select></div></div><div class="form-row"><div class="form-group"><label class="form-label">Deadline Type</label><select name="deadline_type" id="editDeadlineType" class="form-select"><option value="ed">Early Decision</option><option value="ed2">Early Decision II</option><option value="ea">Early Action</option><option value="rea">Restrictive EA</option><option value="rd">Regular Decision</option><option value="rolling">Rolling</option></select></div><div class="form-group"><label class="form-label">Deadline Date</label><input type="date" name="deadline_date" id="editDeadlineDate" class="form-input"></div></div><div class="form-group"><label class="form-label">Status</label><select name="status" id="editStatus" class="form-select">${Object.entries(STATUSES).map(([k,v]) => `<option value="${k}">${v.name}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label class="form-label">Avg GPA</label><input type="number" name="avg_gpa" id="editAvgGpa" class="form-input" step="0.01"></div><div class="form-group"><label class="form-label">Acceptance Rate</label><input type="number" name="acceptance_rate" id="editAcceptanceRate" class="form-input" step="0.1"></div></div><div class="form-group"><label class="form-label">Portal URL</label><input type="url" name="portal_url" id="editPortalUrl" class="form-input"></div><div class="form-group"><label class="form-label">Notes</label><textarea name="notes" id="editNotes" class="form-textarea"></textarea></div></div><div class="modal-footer"><button type="button" onclick="closeEditModal()" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div></form></div></div>
        <!-- Task Modal -->
        <div id="taskModal" class="modal-overlay"><div class="modal"><div class="modal-header"><span class="modal-title">Add Task</span><button onclick="closeTaskModal()" class="btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><form id="taskForm"><div class="modal-body"><div class="form-group"><label class="form-label">Task Name</label><input type="text" name="name" id="taskName" class="form-input" placeholder="e.g., Write personal statement" required></div><div class="form-group"><label class="form-label">Category</label><select name="category" id="taskCategory" class="form-select"><option value="general">General</option><option value="application">Application</option><option value="document">Document</option><option value="recommendation">Recommendation</option><option value="financial">Financial</option></select></div></div><div class="modal-footer"><button type="button" onclick="closeTaskModal()" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Add Task</button></div></form></div></div>
        <!-- Essay Modal -->
        <div id="essayModal" class="modal-overlay"><div class="modal"><div class="modal-header"><span class="modal-title">Add Essay</span><button onclick="closeEssayModal()" class="btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><form id="essayForm"><div class="modal-body"><div class="form-group"><label class="form-label">Essay Title</label><input type="text" name="title" id="essayTitle" class="form-input" placeholder="e.g., Why This College" required></div><div class="form-group"><label class="form-label">Prompt</label><textarea name="prompt" id="essayPrompt" class="form-textarea" placeholder="Enter the essay prompt..."></textarea></div><div class="form-row"><div class="form-group"><label class="form-label">Word Limit</label><input type="number" name="word_limit" id="essayWordLimit" class="form-input" placeholder="e.g., 650"></div><div class="form-group"><label class="form-label">Status</label><select name="status" id="essayStatus" class="form-select"><option value="not_started">Not Started</option><option value="brainstorming">Brainstorming</option><option value="drafting">Drafting</option><option value="reviewing">Reviewing</option><option value="completed">Completed</option></select></div></div></div><div class="modal-footer"><button type="button" onclick="closeEssayModal()" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Add Essay</button></div></form></div></div>
    `;

    // Fill edit form
    document.getElementById('editName').value = college.name;
    document.getElementById('editLocation').value = college.location || '';
    document.getElementById('editType').value = college.type;
    document.getElementById('editDeadlineType').value = college.deadline_type || 'rd';
    document.getElementById('editDeadlineDate').value = college.deadline_date || '';
    document.getElementById('editStatus').value = college.status;
    document.getElementById('editAvgGpa').value = college.avg_gpa || '';
    document.getElementById('editAcceptanceRate').value = college.acceptance_rate || '';
    document.getElementById('editPortalUrl').value = college.portal_url || '';
    document.getElementById('editNotes').value = college.notes || '';

    // Setup form handlers
    document.getElementById('editForm').onsubmit = saveEdit;
    document.getElementById('taskForm').onsubmit = addTask;
    document.getElementById('essayForm').onsubmit = addEssay;
    document.querySelectorAll('.modal-overlay').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('active'); });
}

function openEditModal() { document.getElementById('editModal').classList.add('active'); }
function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }
function openTaskModal() { document.getElementById('taskModal').classList.add('active'); }
function closeTaskModal() { document.getElementById('taskModal').classList.remove('active'); }
function openEssayModal() { document.getElementById('essayModal').classList.add('active'); }
function closeEssayModal() { document.getElementById('essayModal').classList.remove('active'); }

function saveEdit(e) {
    e.preventDefault();
    const college = SeikoData.getCollege(collegeId);
    college.name = document.getElementById('editName').value;
    college.location = document.getElementById('editLocation').value;
    college.type = document.getElementById('editType').value;
    college.deadline_type = document.getElementById('editDeadlineType').value;
    college.deadline_date = document.getElementById('editDeadlineDate').value || null;
    college.status = document.getElementById('editStatus').value;
    college.avg_gpa = parseFloat(document.getElementById('editAvgGpa').value) || null;
    college.acceptance_rate = parseFloat(document.getElementById('editAcceptanceRate').value) || null;
    college.portal_url = document.getElementById('editPortalUrl').value;
    college.notes = document.getElementById('editNotes').value;
    SeikoData.saveCollege(college);
    closeEditModal();
    renderSchool();
}

function toggleTask(taskId, el) {
    const result = SeikoData.toggleTask(collegeId, taskId);
    if (result) {
        el.querySelector('.task-checkbox').classList.toggle('checked', result.done);
        el.querySelector('.task-name').classList.toggle('done', result.done);
        if (result.allDone) showNotification('All tasks completed! Status changed to Submitted');
        setTimeout(renderSchool, 300);
    }
}

function deleteTask(taskId) {
    SeikoData.deleteTask(collegeId, taskId);
    renderSchool();
}

function addTask(e) {
    e.preventDefault();
    SeikoData.addTask(collegeId, { name: document.getElementById('taskName').value, category: document.getElementById('taskCategory').value });
    document.getElementById('taskName').value = '';
    closeTaskModal();
    renderSchool();
}

function updateEssayStatus(essayId, status) {
    SeikoData.updateEssayStatus(collegeId, essayId, status);
}

function deleteEssay(essayId) {
    SeikoData.deleteEssay(collegeId, essayId);
    renderSchool();
}

function addEssay(e) {
    e.preventDefault();
    SeikoData.addEssay(collegeId, { title: document.getElementById('essayTitle').value, prompt: document.getElementById('essayPrompt').value, word_limit: parseInt(document.getElementById('essayWordLimit').value) || null, status: document.getElementById('essayStatus').value });
    document.getElementById('essayTitle').value = '';
    document.getElementById('essayPrompt').value = '';
    document.getElementById('essayWordLimit').value = '';
    closeEssayModal();
    renderSchool();
}

function deleteSchool() {
    if (confirm('Delete this school?')) {
        SeikoData.deleteCollege(collegeId);
        window.location.href = '/schools';
    }
}

function showNotification(message) {
    const n = document.createElement('div');
    n.className = 'notification';
    n.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>${message}</span>`;
    document.body.appendChild(n);
    setTimeout(() => n.classList.add('show'), 10);
    setTimeout(() => { n.classList.remove('show'); setTimeout(() => n.remove(), 300); }, 3000);
}

renderSchool();
</script>
{% endblock %}
