{% extends "base.html" %}

{% block title %}Add College - College Tracker{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/" class="flex items-center gap-1 text-gray-500 hover:text-gray-700 mb-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Back to Dashboard
    </a>
    <h1 class="text-2xl font-bold text-gray-800">Add New College</h1>
</div>

<div class="card p-6">
    <form action="/college/add" method="POST">
        <div class="grid md-grid-cols-2 gap-4">
            <div class="form-group">
                <label for="name">College Name *</label>
                <input type="text" id="name" name="name" placeholder="e.g., Stanford University" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g., Stanford, CA">
            </div>

            <div class="form-group">
                <label for="deadline_type">Deadline Type</label>
                <select id="deadline_type" name="deadline_type">
                    {% for value, label in deadline_types %}
                    <option value="{{ value }}" {% if value == 'regular' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="deadline_date">Deadline Date</label>
                <input type="date" id="deadline_date" name="deadline_date">
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% for value, label, color in statuses %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="website">College Website</label>
                <input type="url" id="website" name="website" placeholder="https://www.stanford.edu">
            </div>

            <div class="form-group">
                <label for="portal_url">Application Portal URL</label>
                <input type="url" id="portal_url" name="portal_url" placeholder="https://apply.stanford.edu">
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Any additional notes about this college..."></textarea>
        </div>

        <div class="flex gap-3 mt-6">
            <button type="submit" class="btn btn-primary">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Add College
            </button>
            <a href="/" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
