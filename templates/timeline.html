{% extends "base.html" %}

{% block title %}Timeline - Seiko{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Timeline</h1>
        <p class="page-subtitle">All your deadlines at a glance</p>
    </div>
</div>

<div id="timelineContainer" class="flex flex-col gap-4">
</div>
{% endblock %}

{% block scripts %}
<script>
function renderTimeline() {
    const colleges = SeikoData.getColleges().filter(c => c.deadline_date);
    const container = document.getElementById('timelineContainer');

    if (colleges.length === 0) {
        container.innerHTML = `
            <div class="card">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <h3>No deadlines set</h3>
                    <p class="mb-4">Add schools with deadlines to see them here</p>
                    <a href="/school/add" class="btn btn-primary">Add School</a>
                </div>
            </div>
        `;
        return;
    }

    colleges.sort((a, b) => new Date(a.deadline_date) - new Date(b.deadline_date));

    const months = {};
    colleges.forEach(college => {
        const date = new Date(college.deadline_date);
        const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
        if (!months[key]) months[key] = [];
        months[key].push(college);
    });

    let html = '';
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    Object.entries(months).forEach(([month, monthColleges]) => {
        html += `<div class="card"><div class="card-header" style="background: var(--bg-primary);"><span class="card-title">${month}</span><span class="badge" style="background: var(--accent); color: white;">${monthColleges.length} deadline${monthColleges.length !== 1 ? 's' : ''}</span></div><div class="card-body">`;

        monthColleges.forEach(college => {
            const days = SeikoData.daysUntil(college.deadline_date);
            const status = STATUSES[college.status] || STATUSES.researching;
            const type = SCHOOL_TYPES[college.type] || SCHOOL_TYPES.reach;
            const deadlineInfo = DEADLINE_TYPES[college.deadline_type] || DEADLINE_TYPES.rd;
            const dateParts = college.deadline_date.split('-');
            const day = parseInt(dateParts[2]);
            const monthIdx = parseInt(dateParts[1]) - 1;

            let daysText = '', daysClass = 'deadline-normal';
            if (days !== null) {
                if (days < 0) daysText = 'Passed';
                else if (days === 0) daysText = 'Today';
                else if (days === 1) daysText = 'Tomorrow';
                else daysText = `${days}d`;
                if (days <= 7) daysClass = 'deadline-urgent';
                else if (days <= 14) daysClass = 'deadline-soon';
            }

            html += `<div class="flex items-center justify-between" style="padding: 1rem; background: var(--bg-primary); border-radius: var(--radius-sm); margin-bottom: 0.5rem;"><div class="flex items-center gap-4"><div style="width: 50px; text-align: center;"><div style="font-size: 1.5rem; font-weight: 700; line-height: 1;">${day}</div><div class="text-xs text-muted">${monthNames[monthIdx]}</div></div><div><a href="/school/${college.id}" class="school-link">${college.name}</a><div class="flex items-center gap-2 mt-1"><span class="badge" style="background: ${type.color}20; color: ${type.color};">${type.name}</span><span class="text-xs text-muted">${deadlineInfo.name}</span></div></div></div><div class="flex items-center gap-3"><span class="badge" style="background: ${status.color}20; color: ${status.color};">${status.name}</span>${days !== null ? `<span class="deadline-days ${daysClass}">${daysText}</span>` : ''}</div></div>`;
        });

        html += `</div></div>`;
    });

    container.innerHTML = html;
}

renderTimeline();
</script>
{% endblock %}
