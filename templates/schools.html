{% extends "base.html" %}

{% block title %}My Schools - Seiko{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">My Schools</h1>
        <p class="page-subtitle" id="schoolCount">0 schools in your list</p>
    </div>
    <a href="/school/add" class="btn btn-primary">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add School
    </a>
</div>

<div id="schoolsContainer">
    <!-- Will be populated by JavaScript -->
</div>
{% endblock %}

{% block scripts %}
<script>
function renderSchools() {
    const colleges = SeikoData.getColleges();
    const container = document.getElementById('schoolsContainer');
    document.getElementById('schoolCount').textContent = `${colleges.length} school${colleges.length !== 1 ? 's' : ''} in your list`;

    if (colleges.length === 0) {
        container.innerHTML = `
            <div class="card">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    <h3>No schools yet</h3>
                    <p class="mb-4">Start building your college list</p>
                    <a href="/school/add" class="btn btn-primary">Add Your First School</a>
                </div>
            </div>
        `;
        return;
    }

    // Sort by deadline
    colleges.sort((a, b) => {
        if (!a.deadline_date) return 1;
        if (!b.deadline_date) return -1;
        return new Date(a.deadline_date) - new Date(b.deadline_date);
    });

    let html = `
        <div class="card">
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>School</th>
                            <th>Type</th>
                            <th>Deadline</th>
                            <th>Progress</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    colleges.forEach(college => {
        const days = SeikoData.daysUntil(college.deadline_date);
        const status = STATUSES[college.status] || STATUSES.researching;
        const type = SCHOOL_TYPES[college.type] || SCHOOL_TYPES.reach;
        const deadlineInfo = DEADLINE_TYPES[college.deadline_type] || DEADLINE_TYPES.rd;

        const tasks = college.tasks || [];
        const doneTasks = tasks.filter(t => t.is_done).length;
        const totalTasks = tasks.length;
        const progress = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

        let daysText = '';
        if (days !== null) {
            if (days === 0) daysText = '(today)';
            else if (days === 1) daysText = '(tomorrow)';
            else if (days > 0) daysText = `(${days}d)`;
            else daysText = '(passed)';
        }

        html += `
            <tr>
                <td>
                    <a href="/school/${college.id}" class="school-link">${college.name}</a>
                    ${college.location ? `<div class="text-xs text-muted">${college.location}</div>` : ''}
                </td>
                <td>
                    <span class="badge" style="background: ${type.color}20; color: ${type.color};">${type.name}</span>
                </td>
                <td>
                    ${college.deadline_date ? `
                        <div class="font-medium">${deadlineInfo.name}</div>
                        <div class="text-xs ${days !== null && days <= 7 ? 'text-danger' : 'text-muted'}">
                            ${college.deadline_date} ${daysText}
                        </div>
                    ` : '<span class="text-muted">Not set</span>'}
                </td>
                <td style="min-width: 120px;">
                    <div class="flex items-center gap-2">
                        <div class="progress" style="flex: 1;">
                            <div class="progress-bar" style="width: ${progress}%;"></div>
                        </div>
                        <span class="text-xs text-muted">${doneTasks}/${totalTasks}</span>
                    </div>
                </td>
                <td>
                    <select onchange="updateStatus(${college.id}, this.value)" class="form-select" style="padding: 0.375rem 0.5rem; font-size: 0.8rem; min-width: 130px; background: ${status.color}15; border-color: ${status.color}40; color: ${status.color};">
                        ${Object.entries(STATUSES).map(([key, val]) =>
                            `<option value="${key}" ${key === college.status ? 'selected' : ''}>${val.name}</option>`
                        ).join('')}
                    </select>
                </td>
                <td>
                    <div class="flex gap-1">
                        <a href="/school/${college.id}" class="btn btn-ghost btn-sm btn-icon" title="View">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </a>
                        ${college.portal_url ? `
                            <a href="${college.portal_url}" target="_blank" class="btn btn-ghost btn-sm btn-icon" title="Open Portal">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                            </a>
                        ` : ''}
                    </div>
                </td>
            </tr>
        `;
    });

    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;

    container.innerHTML = html;
}

function updateStatus(collegeId, status) {
    SeikoData.updateCollegeStatus(collegeId, status);
    renderSchools();
}

// Render on page load
renderSchools();
</script>
{% endblock %}
