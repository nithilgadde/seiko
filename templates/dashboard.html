{% extends "base.html" %}

{% block title %}Dashboard - Seiko{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Track your college applications</p>
    </div>
    <a href="/school/add" class="btn btn-primary">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add School
    </a>
</div>

<div id="urgentAlerts"></div>
<div id="insights" class="mb-4"></div>
<div id="statsGrid" class="grid grid-4 mb-4"></div>
<div id="progressCard" class="mb-4"></div>
<div class="grid grid-2" id="mainContent"></div>
<div id="chancesCard" class="mt-4"></div>
<div id="categoryCard" class="mt-4"></div>

<style>
.alert-urgent{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.05));border:1px solid rgba(239,68,68,.3);border-radius:var(--radius);padding:1.25rem;display:flex;align-items:flex-start;gap:1rem;margin-bottom:1rem}
.alert-icon{width:48px;height:48px;background:rgba(239,68,68,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-icon svg{width:24px;height:24px;stroke:#ef4444}
.alert-title{font-weight:700;font-size:1.1rem;color:#ef4444;margin-bottom:.5rem}
.alert-schools{display:flex;flex-wrap:wrap;gap:.5rem}
.alert-school-link{display:inline-flex;align-items:center;gap:.5rem;padding:.375rem .75rem;background:var(--bg-secondary);border-radius:100px;font-size:.875rem;color:var(--text-primary);text-decoration:none}
.alert-school-link:hover{background:var(--bg-tertiary)}
.alert-days{font-weight:700;color:#ef4444;font-size:.75rem}
.insights-grid{display:flex;flex-direction:column;gap:.75rem}
.insight-card{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;background:var(--bg-secondary);border-radius:var(--radius-sm);border-left:3px solid var(--accent)}
.insight-warning{border-left-color:#f59e0b}.insight-warning .insight-icon{background:rgba(245,158,11,.15)}.insight-warning .insight-icon svg{stroke:#f59e0b}
.insight-info{border-left-color:#3b82f6}.insight-info .insight-icon{background:rgba(59,130,246,.15)}.insight-info .insight-icon svg{stroke:#3b82f6}
.insight-urgent{border-left-color:#ef4444}.insight-urgent .insight-icon{background:rgba(239,68,68,.15)}.insight-urgent .insight-icon svg{stroke:#ef4444}
.insight-success{border-left-color:#10b981}.insight-success .insight-icon{background:rgba(16,185,129,.15)}.insight-success .insight-icon svg{stroke:#10b981}
.insight-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.insight-icon svg{width:20px;height:20px}
.insight-content{flex:1}
.insight-title{font-weight:600;margin-bottom:.125rem}
.insight-message{font-size:.875rem;color:var(--text-secondary)}
.chances-overview{display:flex;flex-wrap:wrap;gap:.75rem}
.chance-pill{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;background:var(--bg-primary);border-radius:100px;text-decoration:none;border:1px solid var(--border)}
.chance-pill:hover{border-color:var(--accent);transform:translateY(-2px)}
.chance-name{color:var(--text-primary);font-weight:500;font-size:.875rem}
.chance-badge{padding:.25rem .625rem;border-radius:100px;font-size:.75rem;font-weight:700}
</style>
{% endblock %}

{% block scripts %}
<script>
function renderDashboard() {
    const colleges = SeikoData.getColleges();
    const profile = SeikoData.getProfile();
    const today = new Date();
    today.setHours(0,0,0,0);

    // Stats
    const total = colleges.length;
    const byStatus = {}, byType = {};
    Object.keys(STATUSES).forEach(s => byStatus[s] = 0);
    Object.keys(SCHOOL_TYPES).forEach(t => byType[t] = 0);
    colleges.forEach(c => {
        if (byStatus[c.status] !== undefined) byStatus[c.status]++;
        if (byType[c.type] !== undefined) byType[c.type]++;
    });

    // Stats Grid
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-icon" style="background:rgba(99,102,241,.15);"><svg width="24" height="24" fill="none" stroke="#6366f1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></div><div class="stat-value">${total}</div><div class="stat-label">Total Schools</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(59,130,246,.15);"><svg width="24" height="24" fill="none" stroke="#3b82f6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></div><div class="stat-value">${byStatus.in_progress + byStatus.preparing}</div><div class="stat-label">In Progress</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(139,92,246,.15);"><svg width="24" height="24" fill="none" stroke="#8b5cf6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="stat-value">${byStatus.submitted}</div><div class="stat-label">Submitted</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,.15);"><svg width="24" height="24" fill="none" stroke="#10b981" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg></div><div class="stat-value">${byStatus.accepted}</div><div class="stat-label">Accepted</div></div>
    `;

    // Progress
    let totalTasks = 0, doneTasks = 0;
    colleges.forEach(c => {
        (c.tasks || []).forEach(t => { totalTasks++; if (t.is_done) doneTasks++; });
    });
    const progress = totalTasks > 0 ? Math.round((doneTasks/totalTasks)*100) : 0;
    if (total > 0) {
        document.getElementById('progressCard').innerHTML = `<div class="card"><div class="card-body"><div class="flex items-center justify-between mb-2"><span class="font-semibold">Overall Progress</span><span class="text-secondary">${progress}% tasks complete</span></div><div class="progress" style="height:10px;"><div class="progress-bar" style="width:${progress}%;"></div></div></div></div>`;
    }

    // Urgent deadlines
    const urgent = colleges.filter(c => {
        if (!c.deadline_date || ['submitted','accepted','rejected','waitlisted','withdrawn'].includes(c.status)) return false;
        const days = SeikoData.daysUntil(c.deadline_date);
        return days !== null && days >= 0 && days <= 7;
    }).map(c => ({ college: c, days: SeikoData.daysUntil(c.deadline_date) })).sort((a,b) => a.days - b.days);

    if (urgent.length > 0) {
        document.getElementById('urgentAlerts').innerHTML = `<div class="alert-urgent"><div class="alert-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div><div class="alert-title">Urgent: ${urgent.length} deadline${urgent.length>1?'s':''} this week!</div><div class="alert-schools">${urgent.map(u => `<a href="/school/${u.college.id}" class="alert-school-link">${u.college.name}<span class="alert-days">${u.days===0?'TODAY':u.days===1?'Tomorrow':u.days+'d'}</span></a>`).join('')}</div></div></div>`;
    }

    // Insights
    const insights = [];
    if (!profile || (!profile.gpa && !profile.sat_score)) {
        insights.push({ type: 'warning', title: 'Complete Your Profile', message: 'Add your GPA and test scores to see personalized chances.', action: '/profile', actionText: 'Add Stats' });
    }
    if (total >= 3 && byType.safety === 0) {
        insights.push({ type: 'warning', title: 'No Safety Schools', message: 'Consider adding 2-3 safety schools.', action: '/school/add', actionText: 'Add School' });
    }
    if (urgent.length > 0) {
        insights.push({ type: 'urgent', title: `${urgent.length} Deadline${urgent.length>1?'s':''} This Week`, message: 'Focus on completing them!', action: '/timeline', actionText: 'View Timeline' });
    }
    if (insights.length > 0) {
        document.getElementById('insights').innerHTML = `<div class="insights-grid">${insights.map(i => `<div class="insight-card insight-${i.type}"><div class="insight-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="insight-content"><div class="insight-title">${i.title}</div><div class="insight-message">${i.message}</div></div>${i.action?`<a href="${i.action}" class="btn btn-sm btn-ghost">${i.actionText}</a>`:''}</div>`).join('')}</div>`;
    }

    // Upcoming & Tasks
    const upcoming = colleges.filter(c => c.deadline_date && !['submitted','accepted','rejected','waitlisted','withdrawn'].includes(c.status) && SeikoData.daysUntil(c.deadline_date) >= 0).sort((a,b) => new Date(a.deadline_date)-new Date(b.deadline_date)).slice(0,5);
    const pendingTasks = [];
    colleges.forEach(c => (c.tasks||[]).filter(t => !t.is_done).forEach(t => pendingTasks.push({ ...t, collegeName: c.name, collegeId: c.id })));

    document.getElementById('mainContent').innerHTML = `
        <div class="card"><div class="card-header"><span class="card-title">Upcoming Deadlines</span><a href="/timeline" class="btn btn-ghost btn-sm">View All</a></div><div class="card-body">${upcoming.length ? upcoming.map(c => {
            const days = SeikoData.daysUntil(c.deadline_date);
            const dl = DEADLINE_TYPES[c.deadline_type] || DEADLINE_TYPES.rd;
            return `<div class="deadline-item"><div><a href="/school/${c.id}" class="deadline-school school-link">${c.name}</a><div class="deadline-type">${dl.name}</div></div><span class="deadline-days ${days<=7?'deadline-urgent':days<=14?'deadline-soon':'deadline-normal'}">${days===0?'Today':days===1?'Tomorrow':days+' days'}</span></div>`;
        }).join('') : '<div class="empty-state"><h3>No upcoming deadlines</h3><p>Add schools to see deadlines</p></div>'}</div></div>
        <div class="card"><div class="card-header"><span class="card-title">Pending Tasks</span></div><div class="card-body">${pendingTasks.length ? pendingTasks.slice(0,5).map(t => `<div class="task-item" onclick="toggleTaskDash(${t.collegeId},${t.id},this)"><div class="task-checkbox"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div><div><div class="task-name">${t.name}</div><div class="task-college">${t.collegeName}</div></div></div>`).join('') : '<div class="empty-state"><h3>No pending tasks</h3><p>All caught up!</p></div>'}</div></div>
    `;

    // Chances
    if (profile && (profile.gpa || profile.sat_score)) {
        const chances = colleges.map(c => ({ college: c, chances: SeikoData.calculateChances(profile, c) })).filter(x => x.chances);
        if (chances.length > 0) {
            document.getElementById('chancesCard').innerHTML = `<div class="card"><div class="card-header"><span class="card-title">Your Chances at a Glance</span><a href="/profile" class="btn btn-ghost btn-sm">Update Stats</a></div><div class="card-body"><div class="chances-overview">${chances.slice(0,8).map(x => `<a href="/school/${x.college.id}" class="chance-pill"><span class="chance-name">${x.college.name.substring(0,20)}</span><span class="chance-badge" style="background:${x.chances.color}20;color:${x.chances.color};">${x.chances.score}%</span></a>`).join('')}</div></div></div>`;
        }
    }

    // Category
    document.getElementById('categoryCard').innerHTML = `<div class="card"><div class="card-header"><span class="card-title">Schools by Category</span></div><div class="card-body"><div class="grid grid-4">${Object.entries(SCHOOL_TYPES).map(([k,v]) => `<div style="padding:1rem;background:var(--bg-primary);border-radius:var(--radius-sm);border-left:3px solid ${v.color};"><div style="font-size:1.5rem;font-weight:700;">${byType[k]||0}</div><div style="color:var(--text-secondary);font-size:.875rem;">${v.name}</div></div>`).join('')}</div></div></div>`;
}

function toggleTaskDash(collegeId, taskId, el) {
    const result = SeikoData.toggleTask(collegeId, taskId);
    if (result) {
        el.querySelector('.task-checkbox').classList.toggle('checked', result.done);
        el.querySelector('.task-name').classList.toggle('done', result.done);
        setTimeout(() => renderDashboard(), 500);
    }
}

renderDashboard();
</script>
{% endblock %}
